name: 打包安卓 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取回代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 安装 Java 17（安卓打包要用）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 生成安卓壳工程
        run: |
          cp -r lib lib_backup
          flutter create --platforms=android --org com.example --project-name chat_ledger .
          cp -r lib_backup/. lib/

      - name: 环境自检（出错时先看这段日志）
        run: flutter doctor -v

      - name: 接受安卓 SDK 许可
        run: yes | flutter doctor --android-licenses || true

      - name: 拉依赖
        run: flutter pub get

      - name: 打包 APK
        run: flutter build apk --release

      - name: 上传 APK（在 Actions 页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: 一句话记账-安装包
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
